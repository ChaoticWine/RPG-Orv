<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Stream - Janela de Atributos</title>
    <style>
        /* Variáveis de Cores (Temas) */
        :root {
            --bg-color: #050a0f;
            --window-bg: rgba(10, 20, 30, 0.95);
            --primary: #4aa8ff;
            --secondary: #00ffcc;
            --text-label: #88ccee;
            --input-bg: rgba(13, 26, 38, 0.7);
            --input-border: #335577;
            --danger: #ff4444;
            --danger-bg: #2a0a0a;
            --warning: #ffaa00;
        }

        [data-theme="blood"] {
            --bg-color: #0f0505;
            --window-bg: rgba(30, 10, 10, 0.95);
            --primary: #ff4a4a;
            --secondary: #ffaa00;
            --text-label: #ee8888;
            --input-bg: rgba(38, 13, 13, 0.7);
            --input-border: #773333;
            --danger: #ff0000;
            --danger-bg: #2a0000;
            --warning: #ff5500;
        }

        [data-theme="gold"] {
            --bg-color: #0f0d05;
            --window-bg: rgba(30, 26, 10, 0.95);
            --primary: #ffd700;
            --secondary: #ffffff;
            --text-label: #eebb88;
            --input-bg: rgba(38, 33, 13, 0.7);
            --input-border: #776633;
            --danger: #ff4a4a;
            --danger-bg: #2a0a0a;
            --warning: #aaff00;
        }

        [data-theme="abyss"] {
            --bg-color: #0a050f;
            --window-bg: rgba(20, 10, 30, 0.95);
            --primary: #a84aff;
            --secondary: #ff00cc;
            --text-label: #cc88ee;
            --input-bg: rgba(26, 13, 38, 0.7);
            --input-border: #553377;
            --danger: #ff4444;
            --danger-bg: #2a0a0a;
            --warning: #00ffcc;
        }

        body {
            background-color: var(--bg-color);
            color: #e0f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            padding: 15px;
            margin: 0;
            transition: background-color 0.5s ease;
        }
        .system-window {
            background: var(--window-bg);
            border: 2px solid var(--primary);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            padding: 25px;
            width: 100%;
            max-width: 800px;
            transition: all 0.5s ease;
        }
        
        /* Controles de Navegação e Tema no Topo */
        .top-controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .sys-select {
            background: var(--input-bg);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
        }
        .sys-select:hover {
            box-shadow: 0 0 8px var(--primary);
        }

        .title {
            text-align: center;
            color: var(--primary);
            font-size: 1.6em;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            text-shadow: 0 0 10px var(--primary);
        }
        .section-title {
            color: var(--secondary);
            font-size: 1.2em;
            text-transform: uppercase;
            margin-top: 15px;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--input-border);
            padding-bottom: 5px;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.2);
        }
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .grid-4col {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: var(--text-label);
        }
        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: #fff;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1em;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 8px var(--secondary);
            background: rgba(0, 0, 0, 0.5);
        }
        input[readonly] {
            border-color: var(--input-border);
            color: var(--secondary);
            background: transparent;
            text-shadow: 0 0 5px var(--secondary);
        }

        /* Expansão das áreas de texto */
        textarea { resize: vertical; min-height: 100px; }
        .area-grande { min-height: 200px; }
        .area-gigante { min-height: 350px; }

        .status-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            text-align: center;
        }
        .status-box label {
            color: var(--secondary);
            display: block;
            margin-bottom: 10px;
        }
        .status-flex {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .status-flex input {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }
        .formula-hint {
            font-size: 0.7em;
            color: var(--text-label);
            margin-top: 8px;
            text-transform: uppercase;
        }

        /* Botões de Ação Final */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s;
            text-align: center;
        }
        .btn-pdf {
            background: var(--input-bg);
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-pdf:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 10px var(--primary);
        }
        .btn-backup {
            background: var(--input-bg);
            color: var(--warning);
            border: 1px solid var(--warning);
        }
        .btn-backup:hover {
            background: var(--warning);
            color: #000;
            box-shadow: 0 0 10px var(--warning);
        }
        .btn-limpar {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid var(--danger);
            grid-column: 1 / -1; /* Ocupa a linha toda */
        }
        .btn-limpar:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 10px var(--danger);
        }

        .btn-voltar {
            background: #ffaa00;
            color: #000;
            border: none;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.4);
            padding: 12px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Sistema de Abas */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 600px) {
            .grid-4col { grid-template-columns: 1fr 1fr; }
            .grid-2col { grid-template-columns: 1fr; }
            .action-buttons { grid-template-columns: 1fr; }
        }

        /* REGRAS DE IMPRESSÃO */
        @media print {
            body { 
                background: var(--bg-color) !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important;
                padding: 0;
            }
            .system-window {
                box-shadow: none;
                border: none;
                max-width: 100%;
                padding: 0;
            }
            .top-controls, .action-buttons, #btnVoltar { display: none !important; }
            .tab-content { display: block !important; margin-bottom: 20px; page-break-inside: avoid; }
            textarea { overflow: hidden !important; border: 1px solid var(--input-border) !important; }
        }
    </style>
</head>
<body>

<div class="system-window">

    <!-- Botão Oculto de Sair do PDF -->
    <button class="btn btn-voltar" id="btnVoltar" onclick="sairPDF()" style="display: none;">[ Sair do Modo de Impressão ]</button>

    <!-- Navegação de Abas e Cores -->
    <div class="top-controls" id="menuControles">
        <select id="tabSelect" class="sys-select">
            <option value="aba_status">▶ Janela de Status Pessoais</option>
            <option value="aba_habilidades">▶ Magias e Habilidades</option>
            <option value="aba_inventario">▶ Inventário Subespacial</option>
            <option value="aba_historia">▶ História e Aparência</option>
        </select>

        <select id="themeSelect" class="sys-select">
            <option value="default">Canal Padrão (Azul)</option>
            <option value="blood">Caos e Sangue (Vermelho)</option>
            <option value="gold">Divindade (Dourado)</option>
            <option value="abyss">Abismo (Roxo)</option>
        </select>
    </div>

    <h1 class="title">[Sistema Star Stream]</h1>

    <!-- ========================================== -->
    <!-- ABA 1: STATUS PESSOAIS E COMBATE           -->
    <!-- ========================================== -->
    <div id="aba_status" class="tab-content active">
        <div class="section-title">Informações da Encarnação</div>
        <div class="grid-2col">
            <div class="input-group">
                <label>Nome:</label>
                <input type="text" id="nome" placeholder="Nome da Encarnação">
            </div>
            <div class="input-group">
                <label>Idade:</label>
                <input type="number" id="idade" placeholder="Idade">
            </div>
            <div class="input-group">
                <label>Nível:</label>
                <input type="number" id="nivel" placeholder="Lv.">
            </div>
            <div class="input-group">
                <label>Constelação Patrona:</label>
                <input type="text" id="constelacao" placeholder="[Nenhuma / Sem Patrono]">
            </div>
            <div class="input-group">
                <label>Pontos Disponíveis:</label>
                <input type="number" id="pontos" placeholder="Pontos para distribuir">
            </div>
        </div>

        <div class="section-title">Títulos</div>
        <div class="input-group">
            <label>Título Principal:</label>
            <input type="text" id="titulo_principal" placeholder="Ex: Rei de Um Mundo Sem Reis">
        </div>
        <div class="input-group">
            <label>Títulos Adicionais:</label>
            <textarea id="titulos_adicionais" placeholder="Liste seus outrosítulos..."></textarea>
        </div>

        <div class="section-title">Status e Atributos</div>
        <div class="grid-2col" style="margin-bottom: 15px;">
            <div class="status-box">
                <label>HP (Pontos de Vida)</label>
                <div class="status-flex">
                    <input type="number" id="hpAtual" placeholder="Atual">
                    <span style="font-size: 1.5em; color: var(--primary);">/</span>
                    <input type="number" id="hpMax" value="0" readonly title="HP Calculado Automaticamente">
                </div>
                <div class="formula-hint">Máx = (Const * 1.5) + (Força / 2)</div>
            </div>
            <div class="status-box">
                <label>MP (Pontos de Mana)</label>
                <div class="status-flex">
                    <input type="number" id="mpAtual" placeholder="Atual">
                    <span style="font-size: 1.5em; color: var(--primary);">/</span>
                    <input type="number" id="mpMax" value="0" readonly title="MP Calculado Automaticamente">
                </div>
                <div class="formula-hint">Máx = (Sabedoria × 2) + (Poder Mágico × 75%)</div>
            </div>
        </div>
        
        <div class="grid-4col">
            <div class="input-group"><label>FOR (Força):</label><input type="number" id="forca" placeholder="Pts."></div>
            <div class="input-group"><label>CONST (Constituição):</label><input type="number" id="constituicao" placeholder="Pts."></div>
            <div class="input-group"><label>DES (Destreza):</label><input type="number" id="destreza" placeholder="Pts."></div>
            <div class="input-group"><label>INT (Inteligência):</label><input type="number" id="inteligencia" placeholder="Pts."></div>
            <div class="input-group"><label>SAB (Sabedoria):</label><input type="number" id="sabedoria" placeholder="Pts."></div>
            <div class="input-group"><label>PM (Poder Mágico):</label><input type="number" id="poderMagico" placeholder="Pts."></div>
        </div>
        
        <div class="input-group">
            <label>Dados de Dano e Fórmulas de Ataque:</label>
            <textarea id="dados_dano" placeholder="- Soco Padrão: 1d4 + FOR (Contusão)&#10;- Espada Larga: 1d8 + FOR (Corte)&#10;- Disparo Mágico: 2d6 + PM (Energia)"></textarea>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ABA 2: MAGIAS E HABILIDADES                -->
    <!-- ========================================== -->
    <div id="aba_habilidades" class="tab-content">
        <div class="section-title">Magias e Habilidades</div>
        <div class="input-group">
            <label>Magias Adquiridas:</label>
            <textarea id="magias" class="area-grande" placeholder="- Nome da Magia | Custo MP | Descrição do Efeito..."></textarea>
        </div>
        <div class="input-group">
            <label>Habilidades (Exclusivas e Gerais):</label>
            <textarea id="habilidades" class="area-grande" placeholder="- [Nome da Habilidade] (Lv. 1) : Efeito principal e limitações..."></textarea>
        </div>
        <div class="input-group">
            <label>Bençãos e Estigmas:</label>
            <textarea id="estigmas" class="area-grande" placeholder="- [Nome do Estigma] : Poder concedido pela Constelação Patrona..."></textarea>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ABA 3: INVENTÁRIO                          -->
    <!-- ========================================== -->
    <div id="aba_inventario" class="tab-content">
        <div class="section-title">Inventário</div>
        <div class="input-group" style="max-width: 250px;">
            <label>Moedas (Coins):</label>
            <input type="number" id="moedas" placeholder="0 C">
        </div>
        <div class="grid-2col">
            <div class="input-group">
                <label>Arma Principal Equipada:</label>
                <input type="text" id="arma" placeholder="Nome da Arma e Grau">
            </div>
            <div class="input-group">
                <label>Armadura/Vestimenta Equipada:</label>
                <input type="text" id="armadura" placeholder="Nome da Armadura e Grau">
            </div>
        </div>
        <div class="input-group">
            <label>Espaço Subespacial (Itens na Bolsa):</label>
            <textarea id="itens" class="area-gigante" placeholder="Liste todas as suas poções, itens de cenário, relíquias das estrelas e materiais de monstros aqui..."></textarea>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ABA 4: HISTÓRIA E APARÊNCIA                -->
    <!-- ========================================== -->
    <div id="aba_historia" class="tab-content">
        <div class="section-title">História e Aparência</div>
        <div class="input-group">
            <label>Traços Marcantes e Aparência:</label>
            <textarea id="aparencia" class="area-grande" placeholder="Altura, cor dos olhos, estilo de roupa, cicatrizes e personalidade da Encarnação..."></textarea>
        </div>
        <div class="input-group">
            <label>Registro Histórico Completo:</label>
            <textarea id="historia" class="area-gigante" placeholder="A história da sua Encarnação antes da queda do mundo, traumas passados, e seu diário de sobrevivência através dos Cenários do Star Stream..."></textarea>
        </div>
    </div>

    <!-- Botões Finais de Exportar/Importar -->
    <div class="action-buttons" id="botoesFinais">
        <button class="btn btn-pdf" onclick="prepararPDF()">[Gerar PDF]</button>
        <button class="btn btn-backup" onclick="exportarBackup()">[Exportar Backup]</button>
        <button class="btn btn-backup" onclick="triggerImport()">[Importar Backup]</button>
        <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importarBackup(event)">
        
        <button class="btn btn-limpar" onclick="limparFicha()">[Apagar Registro da Encarnação]</button>
    </div>

</div>

<script>
    function calcularStatus() {
        let forca = parseFloat(document.getElementById('forca').value) || 0;
        let constituicao = parseFloat(document.getElementById('constituicao').value) || 0;
        let sabedoria = parseFloat(document.getElementById('sabedoria').value) || 0;
        let poderMagico = parseFloat(document.getElementById('poderMagico').value) || 0;

        let hpMaximo = (constituicao * 1.5) + (forca / 2);
        let mpMaximo = (sabedoria * 2) + (poderMagico * 0.75);

        document.getElementById('hpMax').value = Math.floor(hpMaximo);
        document.getElementById('mpMax').value = Math.floor(mpMaximo);
    }

    // ------------------------------------
    // PREPARAÇÃO PERFEITA PARA PDF
    // ------------------------------------
    function prepararPDF() {
        const abas = document.querySelectorAll('.tab-content');
        abas.forEach(aba => {
            aba.style.display = 'block';
            aba.classList.add('active');
        });

        document.getElementById('menuControles').style.display = 'none';
        document.getElementById('botoesFinais').style.display = 'none';
        document.getElementById('btnVoltar').style.display = 'block';

        const textareas = document.querySelectorAll('textarea');
        textareas.forEach(ta => {
            ta.style.height = 'auto';
            ta.style.height = (ta.scrollHeight + 15) + 'px';
        });

        setTimeout(() => {
            window.print();
            alert("✅ MODO PDF ATIVADO!\n\nSe a tela de salvamento não abriu sozinha, vá no menu do navegador (três pontinhos) > Compartilhar > Imprimir.\n\nDepois clique no botão amarelo para voltar.");
        }, 500);
    }

    // ------------------------------------
    // SAIR DO MODO PDF
    // ------------------------------------
    function sairPDF() {
        document.getElementById('menuControles').style.display = 'flex';
        document.getElementById('botoesFinais').style.display = 'grid'; // Volta pro Grid
        document.getElementById('btnVoltar').style.display = 'none';

        const abaAtiva = document.getElementById('tabSelect').value;
        const abas = document.querySelectorAll('.tab-content');
        
        abas.forEach(aba => {
            aba.style.display = '';
            aba.classList.remove('active');
        });
        document.getElementById(abaAtiva).classList.add('active');
    }

    // ------------------------------------
    // EXPORTAR DADOS (BACKUP JSON)
    // ------------------------------------
    function exportarBackup() {
        let dadosBackup = {};
        for (let i = 0; i < localStorage.length; i++) {
            let chave = localStorage.key(i);
            if (chave.startsWith('fichaORV_')) {
                dadosBackup[chave] = localStorage.getItem(chave);
            }
        }
        
        let jsonStr = JSON.stringify(dadosBackup, null, 2);
        let blob = new Blob([jsonStr], { type: "application/json" });
        let url = URL.createObjectURL(blob);
        
        let a = document.createElement('a');
        let nomePersonagem = document.getElementById('nome').value || "Encarnacao";
        a.href = url;
        a.download = `StarStream_${nomePersonagem.replace(/[^a-z0-9]/gi, '_')}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // ------------------------------------
    // IMPORTAR DADOS (BACKUP JSON)
    // ------------------------------------
    function triggerImport() {
        document.getElementById('importFile').click();
    }

    function importarBackup(event) {
        let arquivo = event.target.files[0];
        if (!arquivo) return;

        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let dadosImportados = JSON.parse(e.target.result);
                let count = 0;
                
                // Sobrescreve o armazenamento local apenas com chaves válidas da ficha
                for (let chave in dadosImportados) {
                    if (chave.startsWith('fichaORV_')) {
                        localStorage.setItem(chave, dadosImportados[chave]);
                        count++;
                    }
                }
                
                if(count > 0) {
                    alert("✅ Atributos sincronizados pelo Sistema! A página será recarregada.");
                    location.reload();
                } else {
                    alert("❌ O arquivo não contém dados válidos do Star Stream.");
                }
            } catch (erro) {
                alert("❌ Erro ao ler o arquivo. Certifique-se de que é um arquivo JSON gerado por esta ficha.");
            }
        };
        reader.readAsText(arquivo);
    }

    // ------------------------------------
    // APAGAR FICHA
    // ------------------------------------
    function limparFicha() {
        if(confirm("AVISO DO SISTEMA: Tem certeza que deseja apagar todos os dados desta Encarnação? Isso não pode ser desfeito.")) {
            Object.keys(localStorage).forEach(key => {
                if(key.startsWith('fichaORV_')) {
                    localStorage.removeItem(key);
                }
            });
            location.reload();
        }
    }

    // ------------------------------------
    // INICIALIZAÇÃO E SALVAMENTO AUTOMÁTICO
    // ------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
        const tabSelect = document.getElementById('tabSelect');
        const tabs = document.querySelectorAll('.tab-content');
        
        const abaSalva = localStorage.getItem('fichaORV_abaAtiva') || 'aba_status';
        tabSelect.value = abaSalva;
        tabs.forEach(tab => tab.classList.remove('active'));
        document.getElementById(abaSalva).classList.add('active');

        tabSelect.addEventListener('change', (e) => {
            tabs.forEach(tab => tab.classList.remove('active'));
            document.getElementById(e.target.value).classList.add('active');
            localStorage.setItem('fichaORV_abaAtiva', e.target.value);
        });

        const themeSelect = document.getElementById('themeSelect');
        const temaSalvo = localStorage.getItem('fichaORV_tema') || 'default';
        document.documentElement.setAttribute('data-theme', temaSalvo);
        themeSelect.value = temaSalvo;

        themeSelect.addEventListener('change', (e) => {
            document.documentElement.setAttribute('data-theme', e.target.value);
            localStorage.setItem('fichaORV_tema', e.target.value);
        });

        const campos = document.querySelectorAll('input:not([readonly]), textarea');
        campos.forEach(campo => {
            if(campo.id && campo.type !== 'file') { // Ignora o input file no salvamento automático
                const valorSalvo = localStorage.getItem('fichaORV_' + campo.id);
                if(valorSalvo !== null) {
                    campo.value = valorSalvo;
                }
                campo.addEventListener('input', () => {
                    localStorage.setItem('fichaORV_' + campo.id, campo.value);
                });
            }
        });

        document.getElementById('forca').addEventListener('input', calcularStatus);
        document.getElementById('constituicao').addEventListener('input', calcularStatus);
        document.getElementById('sabedoria').addEventListener('input', calcularStatus);
        document.getElementById('poderMagico').addEventListener('input', calcularStatus);

        calcularStatus();
    });
</script>

</body>
</html>
